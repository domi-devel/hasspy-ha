# Service action *descriptions* (fields/selectors). Names and descriptions come
# from strings.json / translations/<lang>.json under "services".
register_bridge:
  fields:
    bridge:
      required: true
      selector:
        text:
    name:
      selector:
        text:
    scope:
      selector:
        select:
          options:
            - production
            - debug
    run_id:
      selector:
        text:
    ttl:
      selector:
        number:
          min: 5
          max: 86400
          unit_of_measurement: s
    grace:
      selector:
        number:
          min: 0
          max: 172800
          unit_of_measurement: s
    stale_after:
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s
    automations:
      selector:
        object:

