# Service action *descriptions* (fields/selectors). Names and descriptions come
# from strings.json / translations/<lang>.json under "services".
register_bridge:
  fields:
    bridge:
      required: true
      selector:
        text:
    name:
      selector:
        text:
    scope:
      selector:
        select:
          options:
            - production
            - debug
    run_id:
      selector:
        text:
    ttl:
      selector:
        number:
          min: 5
          max: 86400
          unit_of_measurement: s
    grace:
      selector:
        number:
          min: 0
          max: 172800
          unit_of_measurement: s
    stale_after:
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s
    automations:
      selector:
        object:

heartbeat:
  fields:
    bridge:
      required: true
      selector:
        text:
    run_id:
      selector:
        text:
    automations:
      selector:
        object:

log:
  fields:
    bridge:
      required: true
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
    automation:
      selector:
        text:
    level:
      selector:
        select:
          options:
            - debug
            - info
            - warning
            - error
    logbook:
      selector:
        boolean:

remove_bridge:
  fields:
    bridge:
      required: true
      selector:
        text:
    delete_entities:
      selector:
        boolean:

create_entity:
  fields:
    bridge:
      required: true
      selector:
        text:
    automation:
      selector:
        text:
    key:
      required: true
      selector:
        text:
    domain:
      required: true
      selector:
        select:
          options:
            - sensor
            - binary_sensor
            - number
            - select
            - switch
            - datetime
    name:
      selector:
        text:
    object_id:
      selector:
        text:
    device_class:
      selector:
        text:
    unit:
      selector:
        text:
    state_class:
      selector:
        text:
    icon:
      selector:
        icon:
    entity_category:
      selector:
        select:
          options:
            - config
            - diagnostic
    attributes:
      selector:
        object:
    state:
      selector:
        object:
    scope:
      selector:
        select:
          options:
            - production
            - debug
    ttl:
      selector:
        number:
          min: 5
          max: 86400
          unit_of_measurement: s
    pin:
      selector:
        boolean:
    min:
      selector:
        number:
          mode: box
    max:
      selector:
        number:
          mode: box
    step:
      selector:
        number:
          mode: box
    mode:
      selector:
        select:
          options:
            - auto
            - box
            - slider
    options:
      selector:
        object:
    has_date:
      selector:
        boolean:
    has_time:
      selector:
        boolean:

delete_entity:
  fields:
    bridge:
      required: true
      selector:
        text:
    automation:
      selector:
        text:
    key:
      required: true
      selector:
        text:
    purge:
      selector:
        boolean:

list_bridges: {}

list_entities:
  fields:
    bridge:
      selector:
        text:
    automation:
      selector:
        text:
    scope:
      selector:
        select:
          options:
            - production
            - debug

release_session:
  fields:
    bridge:
      required: true
      selector:
        text:
    automation:
      selector:
        text:
    run_id:
      selector:
        text:

sweep:
  fields:
    dry_run:
      selector:
        boolean:

pin:
  fields:
    bridge:
      required: true
      selector:
        text:
    automation:
      selector:
        text:

unpin:
  fields:
    bridge:
      required: true
      selector:
        text:
    automation:
      selector:
        text:

add_rule:
  fields:
    name:
      required: true
      selector:
        text:
    trigger:
      selector:
        object:
    action:
      required: true
      selector:
        object:
    at:
      selector:
        text:
    in:
      selector:
        text:
    bridge:
      selector:
        text:
    key:
      selector:
        text:
    allow_any_action:
      selector:
        boolean:
    fire_now_if_true:
      selector:
        boolean:
    expires_in:
      selector:
        number:
          min: 0
          max: 2592000
          unit_of_measurement: s

cancel_rule:
  fields:
    rule_id:
      required: true
      selector:
        text:
    reason:
      selector:
        text:
    forget:
      selector:
        boolean:

list_rules:
  fields:
    bridge:
      selector:
        text:
    active_only:
      selector:
        boolean:
    include_finished:
      selector:
        boolean:
